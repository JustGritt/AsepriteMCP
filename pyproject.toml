[project]
name = "aseprite-mcp"
version = "0.1.0"
description = "MCP server for iterative pixel-art animation in a live Aseprite session"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "mcp>=1.2.0",
    "websockets>=14.0",
]

[project.scripts]
aseprite-mcp = "aseprite_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aseprite_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "lua: integration tests that require a real Aseprite executable (deselect with -m 'not lua')",
]
